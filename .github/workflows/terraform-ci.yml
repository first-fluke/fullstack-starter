name: Terraform CI

# Runs the same `mise //apps/infra:<stack>:check` task the pre-commit hook
# runs locally (hk.pkl), so the check definition lives only in
# apps/infra/mise.toml: terraform fmt + validate for every stack, plus
# ansible syntax + lint for vm/.

on:
  pull_request:
    paths:
      - "apps/infra/**"
      - "mise.toml"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [gcp, aws, az, oci, vm]

    steps:
      - uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          install_args: terraform uv

      - name: Run static checks
        run: mise //apps/infra:${{ matrix.stack }}:check

      - name: Write job summary
        if: always()
        run: |
          echo "| Stack | Task | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.stack }} | mise //apps/infra:${{ matrix.stack }}:check | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
