[tasks]
# GCP
"gcp:init" = { dir = "gcp", run = "terraform init", description = "Initialize GCP Terraform" }
"gcp:fmt" = { dir = "gcp", run = "terraform fmt -recursive", description = "Format GCP Terraform" }
"gcp:fmt:check" = { dir = "gcp", run = "terraform fmt -check -recursive", description = "Check GCP Terraform format" }
"gcp:validate" = { dir = "gcp", run = "terraform validate", description = "Validate GCP Terraform" }
"gcp:output" = { dir = "gcp", run = "terraform output", description = "Show GCP Terraform outputs" }
"gcp:state:list" = { dir = "gcp", run = "terraform state list", description = "List GCP Terraform state" }
"gcp:plan" = { dir = "gcp", run = "infisical run --env=dev --path=/infra -- terraform plan -var-file=terraform.tfvars", description = "Plan GCP infrastructure" }
"gcp:plan:prod" = { dir = "gcp", run = "infisical run --env=prod --path=/infra -- terraform plan -var-file=terraform.prod.tfvars", description = "Plan GCP production" }
"gcp:apply" = { dir = "gcp", run = "infisical run --env=dev --path=/infra -- terraform apply -var-file=terraform.tfvars", description = "Apply GCP infrastructure" }
"gcp:apply:prod" = { dir = "gcp", run = "infisical run --env=prod --path=/infra -- terraform apply -var-file=terraform.prod.tfvars", description = "Apply GCP production" }
"gcp:destroy" = { dir = "gcp", run = "infisical run --env=dev --path=/infra -- terraform destroy -var-file=terraform.tfvars", description = "Destroy GCP infrastructure" }

