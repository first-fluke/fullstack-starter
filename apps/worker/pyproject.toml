[project]
name = "worker"
version = "0.1.0"
description = "FastAPI worker for async tasks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "google-cloud-tasks>=2.24.0",
    "google-cloud-pubsub>=2.41.0",
    "structlog>=26.1.0",
    "google-auth>=2.58.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "poethepoet>=0.48.0",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-custom-exit-code>=0.3.0",
    "httpx>=0.28.1",
]

[tool.uv]
managed = true

[tool.poe.tasks]
dev = "fastapi dev src/main.py --port 8080"
start = "fastapi run src/main.py --port 8080"
lint = "ruff check --fix --unsafe-fixes ."
format = "ruff format ."
check = ["lint", "format"]
typecheck = "pyrefly check"
test = "pytest tests/ --suppress-no-test-exit-code"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["src"]
search-path = ["."]
preset = "strict"
check-unannotated-defs = true

[tool.pyrefly.errors]
no-any-return = "error"
unannotated-return = "error"
